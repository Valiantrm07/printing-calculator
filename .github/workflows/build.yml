name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Flet Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.22.5 flet-cli==0.22.5

      - name: Run Flutter Doctor and Accept Licenses
        run: |
          flutter doctor
          yes | flutter doctor --android-licenses

      - name: Build APK with Flet
        run: flet build apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: silkscreen-xpress-apk
          path: |
            build/**/*.apk